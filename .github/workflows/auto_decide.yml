name: Auto decide

"on":
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Un seul run à la fois : un 2e run attend la fin du 1er au lieu de
# modifier decision.json en parallèle (conflit constaté le 26/11, run #2).
concurrency:
  group: auto-decide
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # dernière version de main au démarrage, pas celle figée au clic (run #4)
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/algorithm.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add decision.json
          git commit -m "Update decision [automated]" || echo "Nothing to commit"
          git pull --rebase
          git push
